:root{--bg:#fff;--fg:#111;--mut:#777}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#eee;--mut:#999}}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;margin:0;padding:24px 16px;max-width:1100px}
h1{font-family:'Slop Sans Regular';font-size:84px;font-weight:normal;margin:0 0 4px}
.sub{color:var(--mut);margin-bottom:20px}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:14px 0;font-size:14px}
textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;background:transparent;color:var(--fg);border:1px solid var(--mut);border-radius:6px}
#stage{font-size:72px;line-height:1.15;white-space:pre-wrap;word-break:break-word;margin:18px 0 30px;font-family:'Slop Sans Regular'}
.row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:baseline;border-top:1px solid #8884;padding:8px 0}
.row .l{color:var(--mut);font-size:13px}
.row .g{font-size:46px;line-height:1.1}
code{font-size:12px;color:var(--mut)}
</style></head><body>
<h1>Slop Sans</h1>
<div class="sub">A humanist sans as drawn by a model that almost learned the alphabet. Six alternates per glyph, cycled by <code>calt</code>;
stems of H M N h m n fuse into a following stemmed letter; over-kerning fuses stems, bowls, bars, diagonals, and <code>rn</code>→m / <code>cl</code>→d / <code>vv</code>→w.</div>

<textarea id="t" rows="2">Hello World! The quick brown fox jumps over the lazy dog. Minimum pillow channel, clean vowels. HIKE NNN TT AVA</textarea>
<div class="controls">
  <label>Intensity <select id="fam"><option>Mild</option><option selected>Regular</option><option>Extra</option></select></label>
  <label><input type="checkbox" id="calt" checked> calt (cycle + stem merge)</label>
  <label><input type="checkbox" id="kern" checked> kern (fusions)</label>
  <label>Pin alternate <select id="ss"><option value="">none</option>
    <option value="ss01">ss01 wobble</option><option value="ss02">ss02 drop+extra</option><option value="ss03">ss03 melt</option>
    <option value="ss04">ss04 duplicate</option><option value="ss05">ss05 gaps/overshoot</option><option value="ss06">ss06 hybrid</option>
    <option value="ss07">ss07 sober (clean)</option></select></label>
  <label>Size <input type="range" id="sz" min="24" max="160" value="72"></label>
</div>
<div id="stage"></div>

<h3>All seven forms of every glyph (Regular)</h3>
<div id="grid"></div>

<script>
const t=document.getElementById('t'),stage=document.getElementById('stage');
function upd(){
  stage.textContent=t.value;
  stage.style.fontFamily="'Slop Sans "+fam.value+"'";
  stage.style.fontSize=sz.value+'px';
  const f=[]; f.push('"calt" '+(calt.checked?1:0)); f.push('"kern" '+(kern.checked?1:0));
  if(ss.value) f.push('"'+ss.value+'" 1');
  stage.style.fontFeatureSettings=f.join(',');
  stage.style.fontKerning=kern.checked?'normal':'none';
}
for(const id of ['t','fam','calt','kern','ss','sz']) document.getElementById(id).addEventListener('input',upd);
upd();
const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,:;!?-'\"()/&";
const grid=document.getElementById('grid');
for(let i=1;i<=7;i++){
  const r=document.createElement('div');r.className='row';
  const l=document.createElement('div');l.className='l';l.textContent=i<7?'ss0'+i:'ss07 sober';
  const g=document.createElement('div');g.className='g';g.textContent=chars;
  g.style.fontFamily="'Slop Sans Regular'";g.style.fontFeatureSettings='"calt" 0,"kern" 0,"ss0'+i+'" 1';g.style.fontKerning='none';
  r.append(l,g);grid.append(r);
}
</script></body></html>
